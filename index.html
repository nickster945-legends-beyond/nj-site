<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F1A17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Journal">
<title>The Nick Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1A17;--paper:#16241F;--ink:#EDE6D6;--sub:#9FB0A6;--gold:#C9A24A;--rule:#2A3B35;--chip:#22342E;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'EB Garamond',Georgia,serif;
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(201,162,74,.10), transparent 55%),
    radial-gradient(ellipse at 50% 120%, rgba(0,0,0,.45), transparent 60%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.93 0 0 0 0 0.90 0 0 0 0 0.84 0 0 0 .045 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  background-attachment:fixed;}
.wrap{max-width:760px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 18px calc(48px + env(safe-area-inset-bottom))}
.eyebrow{font-family:Inter,system-ui,sans-serif;font-size:12px;letter-spacing:2.4px;text-transform:uppercase;color:var(--sub)}
h1{font-family:Cinzel,serif;font-weight:700;font-size:clamp(30px,8.4vw,40px);letter-spacing:1px;margin:8px 0 0;color:var(--ink);line-height:1.1;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.verse{font-style:italic;color:var(--sub);font-size:18px;margin:8px 0 0;line-height:1.4}
.verse b{color:var(--gold);font-style:normal;font-weight:600;white-space:nowrap}
.hair{height:1px;margin:20px 0 22px;background:linear-gradient(90deg,transparent,rgba(201,162,74,.75) 20%,rgba(201,162,74,.75) 80%,transparent);position:relative}
.hair:after{content:"";position:absolute;left:50%;top:-3px;width:7px;height:7px;background:var(--bg);border:1px solid var(--gold);transform:translateX(-50%) rotate(45deg)}
.topbar{display:flex;justify-content:space-between;align-items:center}
.lockbtn{font-family:Inter,system-ui,sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;background:transparent;color:var(--gold);border:1px solid rgba(201,162,74,.45);border-radius:999px;padding:6px 12px;cursor:pointer}
.search{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:0 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
.search svg{flex:none;opacity:.7}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;padding:13px 0}
.search input::placeholder{color:var(--sub);opacity:.8}
.search:focus-within{border-color:rgba(201,162,74,.6)}
.clear{background:none;border:0;color:var(--sub);font-size:20px;cursor:pointer;padding:0 2px;display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}
.chip{font-family:Inter,system-ui,sans-serif;font-size:13px;padding:7px 13px;border-radius:999px;background:var(--chip);color:var(--ink);border:0;cursor:pointer}
.chip.on{background:var(--gold);color:var(--bg);font-weight:600}
.card{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:20px 20px 18px;margin-bottom:16px;box-shadow:0 10px 24px -18px rgba(0,0,0,.8)}
.card:before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,162,74,.28),transparent)}
.card.stone{border-left:3px solid var(--gold)}
.meta{font-family:Cinzel,serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.t{font-size:24px;font-weight:600;margin:6px 0 2px;line-height:1.2}
.scr{font-size:16px;color:var(--sub);font-style:italic;margin-bottom:10px}
.card p{font-size:18px;line-height:1.6;margin:0 0 10px;opacity:.93}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-family:Inter,system-ui,sans-serif;font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--rule);color:var(--sub);background:transparent;cursor:pointer}
.tag:hover,.tag:active{border-color:rgba(201,162,74,.5);color:var(--gold)}
.empty{color:var(--sub);font-size:17px;padding:8px 4px;font-style:italic}
.foot{color:var(--sub);font-size:15px;margin-top:28px;line-height:1.6;text-align:center}
mark{background:rgba(201,162,74,.28);color:inherit;border-radius:2px;padding:0 1px}
/* unlock */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.gate{width:100%;max-width:420px;text-align:center;background:var(--paper);border:1px solid var(--rule);border-radius:18px;padding:34px 24px 26px;box-shadow:0 20px 40px -24px rgba(0,0,0,.9);position:relative}
.gate:before{content:"";position:absolute;inset:7px;border:1px solid rgba(201,162,74,.22);border-radius:13px;pointer-events:none}
.gate .verse{font-size:17px}
.gate form{margin-top:4px}
.pw{width:100%;background:var(--bg);border:1px solid var(--rule);border-radius:12px;color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;padding:13px 14px;outline:0;text-align:center}
.pw:focus{border-color:rgba(201,162,74,.65)}
.rem{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 16px;font-family:Inter,system-ui,sans-serif;font-size:13px;color:var(--sub)}
.rem input{accent-color:var(--gold);width:16px;height:16px}
.go{width:100%;background:var(--gold);color:var(--bg);border:0;border-radius:12px;font-family:Cinzel,serif;font-weight:700;letter-spacing:1.5px;font-size:15px;padding:13px;cursor:pointer}
.go:disabled{opacity:.6}
.msg{min-height:20px;margin-top:12px;font-family:Inter,system-ui,sans-serif;font-size:13px;color:var(--sub)}
.msg.err{color:#D9A07A}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="lock">
  <div class="gate">
    <div class="eyebrow">Private journal</div>
    <h1>The Nick Journal</h1>
    <div class="verse">"Thus far the Lord has helped us." <b>1 Samuel 7:12</b></div>
    <div class="hair"></div>
    <form id="f" autocomplete="on">
      <input type="text" name="username" value="journal" autocomplete="username" hidden>
      <input class="pw" id="pw" type="password" placeholder="Passphrase" autocomplete="current-password" required>
      <label class="rem"><input type="checkbox" id="rem"> Remember on this device</label>
      <button class="go" id="go" type="submit">Open</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
</div>
<div id="app" hidden>
  <div class="wrap">
    <div class="topbar"><div class="eyebrow">Private journal</div><button class="lockbtn" id="lockbtn" type="button">Lock</button></div>
    <h1>The Nick Journal</h1>
    <div class="verse">"Thus far the Lord has helped us." <b>1 Samuel 7:12</b></div>
    <div class="hair"></div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9A24A" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search words, verses, tags…" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="clr" type="button" aria-label="Clear">&times;</button>
    </div>
    <div class="chips" id="chips"></div>
    <div id="list"></div>
    <div class="foot">Morning devotions and evening check-ins are added here each day.<br>Tap a tag to search for it.</div>
  </div>
</div>

const KEYSTORE = "nj.key.v1";
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const $ = id => document.getElementById(id);
let ENTRIES = [], q = "", filter = "All";
const FILTERS = [["All","All"],["Devotion","Devotions"],["Check-in","Check-ins"],["God moment","God moments"],["Teaching","Teachings"]];

async function deriveKey(pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:b64d(P.salt), iterations:P.iter}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function decryptWith(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(P.iv)}, key, b64d(P.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function openJournal(key){
  ENTRIES = await decryptWith(key);
  ENTRIES.sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.order||0)-(a.order||0));
  $("lock").hidden = true; $("app").hidden = false; render();
}
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function hl(node, text){
  const term = q.trim(); if(!term){ node.textContent = text; return node; }
  const lo = text.toLowerCase(), t = term.toLowerCase(); let i = 0, j;
  while((j = lo.indexOf(t, i)) !== -1){ node.append(text.slice(i,j)); node.append(el("mark", null, text.slice(j, j+t.length))); i = j + t.length; }
  node.append(text.slice(i)); return node;
}
function render(){
  const term = q.trim().toLowerCase();
  const counts = {All: ENTRIES.length}; ENTRIES.forEach(e => counts[e.kind] = (counts[e.kind]||0)+1);
  const chips = $("chips"); chips.replaceChildren();
  FILTERS.forEach(([k,label]) => { const b = el("button", "chip" + (k===filter?" on":""), label + (counts[k] ? " (" + counts[k] + ")" : "")); b.type="button"; b.onclick = () => { filter = k; render(); }; chips.append(b); });
  const shown = ENTRIES.filter(e => {
    if(filter !== "All" && e.kind !== filter) return false;
    if(!term) return true;
    return [e.title, e.scripture||"", e.kind, e.label, e.date, ...(e.body||[]), ...(e.tags||[])].join(" \n ").toLowerCase().includes(term);
  });
  const list = $("list"); list.replaceChildren();
  shown.forEach(e => {
    const c = el("article", "card" + (e.kind==="God moment" ? " stone" : ""));
    c.append(el("div", "meta", e.kind + " \u00b7 " + e.label));
    c.append(hl(el("div","t"), e.title));
    if(e.scripture) c.append(hl(el("div","scr"), e.scripture));
    (e.body||[]).forEach(p => c.append(hl(el("p"), p)));
    const tg = el("div","tags");
    (e.tags||[]).forEach(t => { const b = el("button","tag",t); b.type="button"; b.onclick = () => { setQ(t); window.scrollTo({top:0,behavior:"smooth"}); }; tg.append(b); });
    c.append(tg); list.append(c);
  });
  if(!shown.length) list.append(el("div","empty", q ? 'Nothing matches "' + q + '" yet.' : "No entries here yet."));
  $("clr").style.display = q ? "block" : "none";
}
function setQ(v){ q = v; $("q").value = v; render(); }
$("q").addEventListener("input", e => { q = e.target.value; render(); });
$("clr").onclick = () => setQ("");
$("lockbtn").onclick = () => { localStorage.removeItem(KEYSTORE); ENTRIES = []; $("list").replaceChildren(); q=""; $("q").value=""; $("app").hidden = true; $("lock").hidden = false; $("pw").value=""; $("msg").textContent=""; };
$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const pass = $("pw").value; if(!pass) return;
  $("go").disabled = true; $("msg").className = "msg"; $("msg").textContent = "Opening\u2026";
  try{
    const key = await deriveKey(pass);
    await openJournal(key);
    if($("rem").checked){ localStorage.setItem(KEYSTORE, JSON.stringify({salt:P.salt, k:b64e(await crypto.subtle.exportKey("raw", key))})); }
    $("pw").value = ""; $("msg").textContent = "";
  }catch(err){ $("msg").className = "msg err"; $("msg").textContent = "That passphrase didn't open it. Try again."; }
  $("go").disabled = false;
});
(async () => {
  try{
    const s = JSON.parse(localStorage.getItem(KEYSTORE) || "null");
    if(s && s.salt === P.salt){
      const key = await crypto.subtle.importKey("raw", b64d(s.k), {name:"AES-GCM"}, true, ["decrypt"]);
      await openJournal(key); return;
    }
  }catch(e){ localStorage.removeItem(KEYSTORE); }
  
})();
</script>
